name: SEO image audit
on:
  workflow_dispatch:
  push:
    branches: [audit/seo-images]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/seo-image-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: seo-image-audit
          path: |
            seo-image-audit.md
            seo-image-audit.json
