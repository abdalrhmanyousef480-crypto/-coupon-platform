name: Image changes typecheck (no Vercel functions)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/card-image-renderer.ts'
      - 'scripts/auto-generate-card-images.ts'
      - 'scripts/test-card-image-renderer.ts'
      - '.github/workflows/auto-card-images.yml'
      - 'prisma/schema.prisma'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/image-typecheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Prisma generate and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: npx tsx scripts/test-card-image-renderer.ts
      - run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
