name: Generate new store and coupon WebP images outside Vercel
on:
  schedule:
    - cron: '11,31,51 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write new card images (unchecked = dry run)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: off-vercel-card-image-generator
  cancel-in-progress: false

jobs:
  render-new-cards:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.CARD_IMAGE_AUTOGEN_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts
      - name: Install Arabic font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core
      - name: Render missing NEW cards only
        env:
          SUPABASE_URL: https://gwqtzjqmvrcrvchqdvdi.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY_AUTOGEN: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$APPLY_AUTOGEN" = "true" ]; then
            npx tsx scripts/auto-generate-card-images.ts --apply
          else
            npx tsx scripts/auto-generate-card-images.ts
          fi
