name: One-time controlled image archival
on:
  push:
    branches:
      - fix/coupon-image-archive-batch-20261102
    paths:
      - .github/workflows/archive-existing-images.yml

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  archive-throttled:
    name: Finish eligible old image archival sequentially (75 stores + extra coupons)
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/coupon-image-archive-batch-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ensure previous batch succeeded (never overlap old-image CPU)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="unknown"
          for attempt in $(seq 1 80); do
            response=$(curl --silent --show-error --fail --max-time 15 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/abdalrhmanyousef480-crypto/-coupon-platform/actions/runs/41389921763")
            status=$(printf '%s' "$response" | jq -r '.status')
            conclusion=$(printf '%s' "$response" | jq -r '.conclusion // "unknown"')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Previous migration did not succeed; stop to protect images"
                exit 1
              fi
              echo "Previous migration succeeded. Starting the next sequential group."
              break
            fi
            sleep 15
          done
          if [ "$status" != "completed" ]; then
            echo "Previous migration not complete; this run is safely stopped."
            exit 1
          fi
      - name: Fetch independent OIDC per store and archive max two assets
        shell: bash
        env:
          FUNCTION_URL: https://gwqtzjqmvrcrvchqdvdi.supabase.co/functions/v1/archive-coupon-image-test
        run: |
          set -euo pipefail
          # No cron, no parallel requests, no database credentials in GitHub.
          # A fresh short-lived OIDC token is requested for each item.
          for store_slug in fdeshdashti florose givtaat grovv-shop hawraaabaya hennaplantshop hismile homevibe honeydose inivita inner-caresa istoria jahz-shwbz-jahez-shops jeeny jomla jw-sbwrt-or-go-sport jwfna kenz-woman khezanti locabeautysa luma-tissue luxuryguise maherstore maraeialshamal maysamco mazeed mbarkpe mfarsh-alayyry mfarsh-alsultan mlay mmzwrld-or-mumzworld mobcogroup mtrw-brazyl-or-metro-brazil nabata nabhan namshi natcho ngwaa nice-one noon ntshop opera-fashion osma oxygen ozee perfume-co pets-houses phonezone rafh rahef rebunesastore reef-perfumes renza ro3eh roshin sadeim season-sa shein silverback soca sssports styli sulindastore swytr syarah tabibgroup tahara temu treatmentstore tryndywl-or-trendyol uniformplues vogacloset whites wtaa zid almatar arushi asnasstore eseven-store faisalaldayel ghym ntshop osma rebunesastore reef-perfumes swytr; do
            echo "Processing at most two pre-approved old images: $store_slug"
            token_json=$(curl --silent --show-error --fail --max-time 20 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=couponsnoor-image-archive-20261102")
            jwt=$(printf '%s' "$token_json" | jq -r '.value')
            if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
              echo "Signed OIDC identity unavailable"; exit 1
            fi
            response=$(curl --silent --show-error --fail --max-time 110 \
              --request POST \
              --header "Authorization: Bearer ${jwt}" \
              --header "Content-Type: application/json" \
              --data "{\"storeSlug\":\"$store_slug\"}" \
              "$FUNCTION_URL")
            # Report safe paths + checksums, never the token.
            printf '%s\n' "$response" | jq '.'
            printf '%s\n' "$response" | jq -e '(.processed >= 0) and (.results | all(.status == "archived"))'
            # Spare the Vercel production CPU. One pair at a time.
            sleep 15
          done
