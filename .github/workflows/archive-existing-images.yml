name: One-time controlled image archival
on:
  push:
    branches:
      - fix/coupon-image-archive-batch-20261102
    paths:
      - .github/workflows/archive-existing-images.yml

permissions:
  contents: read
  id-token: write

jobs:
  archive-throttled:
    name: Archive twelve stores and coupons with per-item SHA256 verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/coupon-image-archive-batch-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch independent OIDC per store and archive max two assets
        shell: bash
        env:
          FUNCTION_URL: https://gwqtzjqmvrcrvchqdvdi.supabase.co/functions/v1/archive-coupon-image-test
        run: |
          set -euo pipefail
          # No cron, no parallel requests, no database credentials in GitHub.
          # A fresh short-lived OIDC token is requested for each item.
          for store_slug in almatar alraed-home alrefai-center alsaifgallery arushi asnasstore aya-abayas azranz39 barllina baylasan beautyfact bladna; do
            echo "Processing at most two pre-approved old images: $store_slug"
            token_json=$(curl --silent --show-error --fail --max-time 20 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=couponsnoor-image-archive-20261102")
            jwt=$(printf '%s' "$token_json" | jq -r '.value')
            if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
              echo "Signed OIDC identity unavailable"; exit 1
            fi
            response=$(curl --silent --show-error --fail --max-time 110 \
              --request POST \
              --header "Authorization: Bearer ${jwt}" \
              --header "Content-Type: application/json" \
              --data "{\"storeSlug\":\"$store_slug\"}" \
              "$FUNCTION_URL")
            # Report safe paths + checksums, never the token.
            printf '%s\n' "$response" | jq '.'
            printf '%s\n' "$response" | jq -e '(.processed >= 0) and (.results | all(.status == "archived"))'
            # Spare the Vercel production CPU. One pair at a time.
            sleep 15
          done
